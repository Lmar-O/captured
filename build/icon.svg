<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4589ff"/>
      <stop offset="1" stop-color="#0f62fe"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- macOS squircle: content inset ~10% of the canvas -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#g)"/>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#sheen)"/>

  <!-- Play triangle, corners rounded by stroking with the fill colour -->
  <path d="M 432 372 L 432 652 L 676 512 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="56"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
