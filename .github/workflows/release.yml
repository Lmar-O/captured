name: Release

# Builds the universal DMG on a macOS runner and attaches it to the release
# for the tag being built. Push a tag (`git tag v1.1.0 && git push origin
# v1.1.0`) or run this manually against an existing tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build universal DMG
        run: npm run dist
        env:
          # No Developer ID in CI. electron-builder would otherwise hunt the
          # keychain for a certificate and fail the build; build/after-pack.js
          # ad-hoc signs the bundle instead, which is what makes it runnable
          # on Apple Silicon.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify the signature survived packaging
        run: |
          APP="dist/mac-universal/Captured.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -q 'Identifier=com.captured.app'
          lipo -archs "$APP/Contents/MacOS/Captured"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Captured ${TAG#v}" \
              --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" dist/*.dmg --clobber
